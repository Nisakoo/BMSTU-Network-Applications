<!doctype html>
<html>
    <head>
        <title>Калькулятор</title>

        <link href="styles/main.css" rel="stylesheet" />
    </head>
    <body class="dark-theme">
        <div class="container">
            <div class="result" id="result-box">0</div>

            <div class="button-group">
                <button class="btn secondary" id="btn-clear">C</button>
                <button class="btn secondary" id="btn-sign">±</button>
                <button class="btn secondary" id="btn-percent">%</button>
                <button class="btn primary" id="btn-div">÷</button>

                <button class="btn" id="btn-digit-seven">7</button>
                <button class="btn" id="btn-digit-eight">8</button>
                <button class="btn" id="btn-digit-nine">9</button>
                <button class="btn primary" id="btn-mult">×</button>

                <button class="btn" id="btn-four">4</button>
                <button class="btn" id="btn-five">5</button>
                <button class="btn" id="btn-six">6</button>
                <button class="btn primary" id="btn-minus">-</button>

                <button class="btn" id="btn-one">1</button>
                <button class="btn" id="btn-two">2</button>
                <button class="btn" id="btn-three">3</button>
                <button class="btn primary" id="btn-plus">+</button>

                <button class="btn" id="btn-zero">0</button>
                <button class="btn" id="btn-dot">.</button>
                <button class="btn btn-long accent" id="btn-equal">=</button>
            </div>
        </div>

        <span class="sign">ИУ5-41Б Баженов Н. В.</span>
        <a class="btn github-link primary" href="https://github.com/Nisakoo/BMSTU-Network-Applications" target="_blank">GitHub</a>
        <button class="btn theme-switcher primary" id="switcher"></button>

        <script src="scripts/main.js""></script>
    </body>
</html>
